<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Category Pricing Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Simple flow: a top menu with search on every page, a filter menu beside the products, product details in a side drawer.
   Brand: Aidacare palette and type (Brand Guide 2025). Text in Coal and Graphite; Green, Dark Green, Lime, Teal for emphasis. */
:root{
  --bg:#FFFFFF; --sunk:#F4F5F6; --sunk2:#EFF1F2; --ink:#394A58; --text:#4C4C4E; --line:#D3D8DC; --line2:#EBEEF0; --field:#B4BCC3;
  --green:#34B233; --dkgreen:#007D57; --lime:#BED600; --teal:#007C92; --coal:#394A58; --mist:#8996A0;
  --display:"Montserrat","Segoe UI",Arial,sans-serif;
  --body:"Aptos","Proxima Nova","Segoe UI",system-ui,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:400 14px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--teal)} a:hover{color:var(--coal)}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1{font:700 28px/1.15 var(--display);color:var(--ink);margin:0}
h2{font:700 17px/1.25 var(--display);color:var(--ink);margin:0}
h3{font:700 12px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin:0}
.small{font-size:12px;color:var(--text);margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--field);background:#fff;color:var(--ink);font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--teal);color:var(--ink)}
.btn.primary{background:var(--dkgreen);border-color:var(--dkgreen);color:#fff;font-weight:700}
.btn.primary:hover{filter:brightness(.94);color:#fff}
.btn:disabled{opacity:.55;cursor:default}
.linkbtn{background:none;border:0;padding:10px 4px;margin:-10px -4px;color:var(--teal);font-weight:600;cursor:pointer;text-decoration:underline;font-size:13px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;color:#fff}
.pill.above{background:var(--coal)} .pill.below{background:var(--teal)} .pill.inline{background:var(--dkgreen)}
.pill.flag{background:var(--sunk2);color:var(--ink)}
.act{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap;border:1px solid transparent;line-height:1.5}
.a-keep{background:var(--dkgreen);color:#fff} .a-up{background:var(--teal);color:#fff} .a-down{background:var(--coal);color:#fff}
.a-watch{background:#fff;color:var(--coal);border:2px solid var(--lime)} .a-investigate{background:var(--lime);color:var(--coal)}
.a-investigate.inv-hi{background:var(--dkgreen);color:#fff} .a-investigate.inv-lo{background:#B3261E;color:#fff}
.a-setlist{background:#fff;color:var(--ink);border:1px dashed var(--ink)} .a-nomkt{background:var(--sunk2);color:var(--ink)}
.a-runout{background:#fff;color:var(--ink);border:1px solid var(--mist)} .a-none{background:#fff;color:var(--text);border:1px solid var(--line)}
.thb{all:unset;cursor:pointer;font:inherit;color:inherit;display:inline-block;padding:9px 0;margin:-9px 0}
.thb:hover{text-decoration:underline}
.thb:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}
.few{font-weight:400;color:var(--text)} .gt{font-weight:700} .gt.above{color:var(--coal)} .gt.below{color:var(--teal)} .gt.inline{color:var(--dkgreen)}
.qd{display:flex;flex-direction:column;gap:10px;margin-top:8px;padding-top:10px;border-top:1px solid var(--line2)}
.qd fieldset{border:0;margin:0;padding:0;min-width:0}
.qd legend{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:6px;padding:0}
.qopts{display:flex;flex-wrap:wrap;gap:6px}
.qopt{min-height:36px;padding:0 14px;border:1px solid var(--field);border-radius:8px;background:#fff;color:var(--ink);font:600 13px/1 var(--body);cursor:pointer}
.qopt:hover{border-color:var(--teal)}
.qopt[aria-pressed="true"]{background:var(--coal);border-color:var(--coal);color:#fff}
.qgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px}
.qgrid .fld[hidden]{display:none}
@media (max-width:700px){ .qgrid{grid-template-columns:1fr} }
.actbox{border:1px solid var(--line);border-left:5px solid var(--c,var(--coal));border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.actbox p{margin:0;font-size:13px}
.fld select{width:100%;border:1px solid var(--field);border-radius:8px;padding:8px 10px;background:#fff}
.msg{padding:14px;border:1px dashed var(--line);border-radius:10px;color:var(--text)}
.msg.warn{border-color:var(--coal);color:var(--coal)}

/* top menu */
.bar{position:sticky;top:0;z-index:15;background:var(--coal);border-bottom:3px solid var(--green)}
.bar :focus-visible{outline-color:var(--lime)}
.bar-in{max-width:1440px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:12px;font:700 15px/1.2 var(--display);color:#fff;text-decoration:none;white-space:nowrap}
.brand:hover{color:#fff}
.brand img{height:30px;width:auto;display:block}
.brand span{padding-left:12px;border-left:1px solid rgba(255,255,255,.4)}
.gsearch{position:relative;flex:1 1 320px;max-width:460px}
.gsearch input{width:100%;height:42px;padding:0 14px;border:1px solid transparent;border-radius:10px;background:#fff;color:var(--ink)}
.gsearch input:focus{background:#fff}
.gres{position:absolute;left:0;right:0;top:46px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(57,74,88,.18);padding:6px;max-height:70vh;overflow:auto;z-index:16}
.gr{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:8px;text-decoration:none;color:var(--text)}
.gr:hover,.gr:focus{background:var(--sunk);color:var(--text)}
.gr img{width:40px;height:40px;object-fit:contain}
.gr .nm{font-weight:700;color:var(--ink);display:block}
.gres .all{display:block;padding:8px;font-weight:600;font-size:13px}
.gres .none{padding:10px;margin:0}
nav.main{display:flex;gap:4px;margin-left:auto}
nav.main a{padding:10px 12px;border-radius:8px;text-decoration:none;color:#fff;font-weight:600;white-space:nowrap}
nav.main a:hover{background:rgba(255,255,255,.12);color:#fff}
nav.main a[aria-current="page"]{background:rgba(255,255,255,.14);box-shadow:inset 0 -3px 0 var(--green)}
.menubtn{display:none}
.bar .menubtn{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.bar .menubtn:hover{border-color:#fff;color:#fff}

.wrap{max-width:1440px;margin:0 auto;padding:22px 24px 48px;display:flex;flex-direction:column;gap:18px}
.ph{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:flex-end;justify-content:space-between}
.ph .sub{margin:4px 0 0;color:var(--text)}

/* home */
.hkpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.hk{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border:1px solid var(--line);border-top:4px solid var(--c,var(--line));border-radius:12px;background:#fff}
.hk .v{font:700 32px/1.1 var(--display);color:var(--ink)} .hk .k{font-weight:700;color:var(--ink)} .hk .s{font-size:12px;color:var(--text)}
.hk.above{--c:var(--coal)} .hk.inline{--c:var(--dkgreen)} .hk.below{--c:var(--teal)} .hk.review{--c:var(--lime)}
.hsec{display:flex;flex-direction:column;gap:12px}
.mgrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;align-items:start}
.mgr{display:flex;flex-direction:column;gap:4px;padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff}
.mgr .mh{display:flex;justify-content:space-between;align-items:center;font:700 20px/1.2 var(--display);color:var(--ink);text-decoration:none;padding:2px 8px 8px}
.mgr .mh:hover{color:var(--teal)}
.mcat{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;padding:8px;border-radius:10px;text-decoration:none;color:inherit}
.mcat:hover{background:var(--sunk);color:inherit}
.mcat .im{width:56px;height:56px;border-radius:8px;background:var(--sunk);display:flex;align-items:center;justify-content:center;overflow:hidden}
.mcat .im img{max-width:100%;max-height:100%;object-fit:contain}
.mcat .ln{display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-size:13px} .mcat .ln > span:last-child{white-space:normal}
.mcat .nm{font-weight:700;font-size:15px;color:var(--ink)}
.mcat .rv{color:var(--ink);white-space:nowrap}
.mgr .todo{padding:8px 8px 0;color:var(--text)}
.pbar{display:flex;gap:2px;height:8px;margin-top:6px;border-radius:4px;overflow:hidden}
.pbar i,.legend i{display:block;height:100%}
.pbar .above,.legend .above{background:var(--coal)} .pbar .inline,.legend .inline{background:var(--dkgreen)} .pbar .below,.legend .below{background:var(--teal)} .pbar .none,.legend .none{background:var(--line)}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text)} .legend i{width:10px;height:10px;border-radius:2px;margin-left:8px}
.hgaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.hgap{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;text-decoration:none;color:inherit}
.hgap:hover{border-color:var(--teal);color:inherit}
.hgap > span:last-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.hgap .nm{font-weight:700;color:var(--ink)} .hgap .g{font-weight:700}
@media (max-width:900px){ .hkpis{grid-template-columns:repeat(2,minmax(0,1fr))} .legend{flex-wrap:wrap} }
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.catcard{display:flex;flex-direction:column;gap:12px;padding:18px;border:1px solid var(--line);border-radius:16px;text-decoration:none;color:inherit;background:#fff}
.catcard:hover{border-color:var(--teal);box-shadow:0 4px 14px rgba(57,74,88,.1);color:inherit}
.imgs{display:flex;gap:8px}
.imgs span{flex:1;height:130px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.imgs img{max-width:100%;max-height:100%;object-fit:contain}
.catcard .nm{font:700 20px/1.2 var(--display);color:var(--ink)}
.back{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;margin:0 0 10px;border:1px solid var(--field);border-radius:10px;background:#fff;color:var(--ink);font-weight:600;cursor:pointer}
.back:hover{border-color:var(--teal)}
.kpis .tile{cursor:pointer;text-align:left;font:inherit;color:inherit}
.kpis .tile:hover{box-shadow:inset 0 0 0 2px var(--teal)}
.acts{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.acts details{border-top:1px solid var(--line)} .acts details:first-child{border-top:0}
.acts summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px;border-left:5px solid var(--c)}
.acts summary .act{min-width:110px;justify-content:center}
.acts summary::-webkit-details-marker{display:none}
.acts summary:hover{background:var(--sunk)}
.acts summary .n{font:700 15px/1 var(--display);color:var(--ink)}
.acts summary .chev{margin-left:auto;transition:transform .15s;color:var(--ink);font-weight:700;font-size:18px}
.acts details[open] summary .chev{transform:rotate(90deg)}
.acts ul{list-style:none;margin:0;padding:0 16px 8px 21px}
.acts li{display:grid;grid-template-columns:minmax(150px,1fr) repeat(3,96px) minmax(0,2.2fr);gap:4px 16px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line2);font-size:13px;font-variant-numeric:tabular-nums}
.acts li .v{text-align:right;font-weight:700;color:var(--ink)}
.acts li .v small{display:none}
.acts li.hd{border-top:0;padding:6px 0 4px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text)}
.acts li.hd .v{font-weight:700;color:var(--text)}
.acts li a{font-weight:700;color:var(--ink);text-decoration:none;font-size:14px;padding:6px 0;margin:-6px 0}
.acts li a:hover{text-decoration:underline}
.acts li .why{color:var(--text)}
.acts li .mine{font-size:12px;font-weight:700;color:var(--dkgreen)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpis .tile{background:var(--sunk);border:0}
.kpis .v{font-size:26px}
.decs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.dec{border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.dec{border-top-color:var(--c)}
.dec ul{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column}
.dec li{display:flex;flex-direction:column;gap:1px;padding:8px 0;border-top:1px solid var(--line2);font-size:13px;font-variant-numeric:tabular-nums}
.dec li a{font-weight:700;color:var(--ink);text-decoration:none;font-size:14px}
.dec li a:hover{text-decoration:underline}
.dec h3{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0}
.dec h3 .n{font-size:13px;color:var(--text);font-weight:600}

/* overview */
.ov{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:4px}
.tile .k{font-size:12px;color:var(--text)}
.tile .v{font:700 22px/1.2 var(--display);color:var(--ink)}
.tile .s{font-size:13px;color:var(--text)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* layout with filter menu */
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}
.side{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:18px;background:#fff}
.side .grp{display:flex;flex-direction:column;gap:6px}
.side input,.side select{width:100%;height:42px;padding:0 12px;border:1px solid var(--field);border-radius:10px;background:#fff;color:var(--ink)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:38px;padding:0 12px;border:1px solid transparent;border-radius:8px;background:none;text-align:left;color:var(--ink);cursor:pointer}
.opt:hover{background:var(--sunk)}
.opt[aria-pressed="true"]{background:var(--coal);color:#fff;font-weight:600}
.opt[aria-pressed="true"] .n{color:#fff}
.opt .n{font-size:12px;color:var(--text);font-variant-numeric:tabular-nums}
.opt:disabled{opacity:.45;cursor:default}
.opt i{width:10px;height:10px;border-radius:2px;background:var(--c);display:inline-block;margin-right:8px}
.filterbtn{display:none}
.content{display:flex;flex-direction:column;gap:18px;min-width:0}
.showing{margin:0;font-weight:600;color:var(--ink)}
.need h2{margin-bottom:10px}
.tiers{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:14px}
.tier{display:flex;flex-direction:column;gap:8px;min-width:0}
.tier .th{border-top:4px solid var(--c);padding-top:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.empty{margin:0;padding:12px;border:1px dashed var(--line);border-radius:12px;color:var(--text);font-size:13px}
.card{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;padding:12px;border-radius:12px;background:#fff;border:1px solid var(--line);cursor:pointer}
.card:hover{border-color:var(--teal);box-shadow:0 2px 8px rgba(57,74,88,.1)}
.card.sel{box-shadow:0 0 0 3px var(--teal)}
.ctop{display:flex;gap:12px;align-items:center}
.cact{margin-left:auto;align-self:flex-start;flex:none}
.thumb{width:56px;height:56px;flex:none;border-radius:8px;border:1px solid var(--line2);background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.thumb.none{font-size:10px;color:var(--text);text-align:center;line-height:1.2;padding:4px}
.cinfo{display:flex;flex-direction:column;gap:2px;min-width:0}
.cinfo .nm{font:700 15px/1.25 var(--display);color:var(--ink)}
.cinfo .sp{font-size:12px;color:var(--text)}
.cinfo .kind{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text)}
.pr{display:flex;flex-direction:column;gap:8px;font-size:13px;font-variant-numeric:tabular-nums;border-top:1px solid var(--line2);padding-top:8px}
.nums{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:8px}
.nums > span{display:flex;flex-direction:column;gap:1px;min-width:0}
.nums small{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--text);white-space:nowrap}
.nums b{font:700 15px/1.2 var(--display);color:var(--ink)}
.nums i{font-style:normal;color:var(--text)}
.pr .list{font-weight:700;color:var(--ink)}
.pr .mk b{color:var(--ink)}
.pr .gl{flex-basis:100%}
.pline{border:1px solid var(--line);border-radius:10px;padding:12px 14px 10px;display:flex;flex-direction:column;gap:8px}
.pline .trk{position:relative;height:34px;margin:0 8px}
.pline .trk::before{content:"";position:absolute;left:0;right:0;top:16px;height:2px;background:var(--line)}
.pline .d{position:absolute;top:10px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--mist)}
.pline .d.c{background:var(--mist)} .pline .d.o{background:var(--green);box-shadow:0 0 0 1px var(--dkgreen)}
.pline .lst{position:absolute;top:2px;bottom:2px;width:3px;margin-left:-1.5px;background:var(--teal);border-radius:2px}
.pline .avg{position:absolute;top:6px;bottom:6px;width:0;margin-left:-1px;border-left:2px dashed var(--coal)}
.pline .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--text);font-variant-numeric:tabular-nums}
.pline .key{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--text)}
.pline .key i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.pline .key i.l{width:3px;height:12px;border-radius:1px;background:var(--teal)} .pline .key i.a{width:0;height:12px;border-radius:0;border-left:2px dashed var(--coal)}
.cbox .cr .nt{display:block;font-size:12px;color:var(--text)}
.cbox.ours{border-color:var(--green)} .cbox.ours .ch{background:#EAF7EA}
.leave{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}

/* drawer */
.dbg{position:fixed;inset:0;background:rgba(57,74,88,.45);z-index:18;display:none}
.drawer{position:fixed;inset:0;width:100%;background:#fff;z-index:19;overflow:auto;display:none;flex-direction:column}
.open-d .dbg{display:block} .open-d .drawer{display:flex}
.dhead{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:12px max(16px,calc((100% - 1200px)/2));display:flex;align-items:center;gap:12px;z-index:1}
.dhead h2{flex:1;font-size:19px;min-width:0}
.dhead .btn{min-height:40px;padding:0 12px}
@media (max-width:600px){ .dhead{flex-wrap:wrap} .dhead h2{flex:1 1 calc(100% - 60px)} .dhead .xbtn{order:1} .dhead .btn,.dhead #dMsg{order:2} }
.xbtn{border:0;background:none;color:var(--ink);font-size:28px;line-height:1;min-width:44px;min-height:44px;cursor:pointer;border-radius:8px}
.xbtn:hover{background:var(--sunk)}
.dbody{width:100%;max-width:1232px;margin:0 auto;padding:20px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
.dcol{display:flex;flex-direction:column;gap:18px;min-width:0}
@media (max-width:900px){ .dbody{grid-template-columns:1fr} }
.dtop{display:flex;gap:14px;align-items:flex-start}
.dtop .thumb{width:120px;height:120px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:6px;background:var(--sunk2);font-size:12px;color:var(--ink)}

function propTag(note, url, name){
  if(PROP_BOTH.has(url)) return ["AP","SP"];

  const ap = /attendant|transit|\bap\b/.test(t), sp = /self ?propel|\bsp\b/.test(t);

}
const tagOf = (cfg, s, name) => cfg && cfg.kind==="type" ? propTag(s.note, s.url, name) : sizeTag(s.note, s.url);
function sizeTag(note, url){

    if(/\bfrom\b|as low as|smallest size|starting at/.test(t)) return ["from"];
    const h = [];
    if(/king single|\bks\b/.test(t)) h.push("KS");
    if(/(^|[^g] )long single|\bls\b/.test(t)) h.push("LS");
    if(/long double|\bld\b/.test(t)) h.push("LD"); else if(/\bdouble\b/.test(t)) h.push("D");
    if(/\bqueen\b/.test(t)) h.push("Q");
    if(!h.length && /\bsingle\b/.test(t)) h.push("S");
    return h.length===1 ? h : h.length ? ["?"] : null; };

}

function route(){
  const h = decodeURIComponent((location.hash||"").slice(1));
  const pm = /^(home|table|report|summary|slots)\/p\/(.+)$/.exec(h);
  if(pm) return {v:pm[1], pid:S.prods.has(pm[2])?pm[2]:null};
  if(h==="price-table" || h==="table") return {v:"table"};
  if(h==="report") return {v:"report"};
  if(h==="summary") return {v:"summary"};
  if(h==="slots") return {v:"slots"};
  if(h==="states") return {v:"states"};
  const mg = /^mgr\/([a-z]+)(?:\/p\/(.+))?$/.exec(h);
  if(mg && mgrOf(mg[1])) return {v:"mgr", mgr:mg[1], pid:mg[2] && S.prods.has(mg[2]) ? mg[2] : null};
  const gm = /^grp\/([^/]+)$/.exec(h);
  if(gm && grpOf(gm[1])) return {v:"grp", grp:gm[1]};
  const m = /^cat\/([^/]+)(?:\/(.+))?$/.exec(h);
  if(m && catOf(m[1])) return {v:"cat", cat:m[1], pid:m[2]||null};
  if(m && grpOf(m[1])){ const p = m[2] && S.prods.get(m[2]); return p ? {v:"cat", cat:p.cat, pid:p.id} : {v:"grp", grp:m[1]}; }
  if(catOf(h)) return {v:"cat", cat:h, pid:null};
  if(grpOf(h)) return {v:"grp", grp:h};
  return {v:"home"};
}

function salesSum(list){
  const t={u:0,p:0,rev:0,gp:0,n:0};
  list.forEach(p=>{ const s=p.sales; if(!s||s.units==null) return; t.n++; t.u+=s.units; t.p+=s.prior||0; if(s.net!=null){ const r=s.units*s.net; t.rev+=r; if(s.gm!=null) t.gp+=r*s.gm/100; } });
  t.chg = t.p ? (t.u/t.p-1)*100 : null; t.gm = t.rev ? t.gp/t.rev*100 : null;
  return t;
}

function catCard(c){

function heroOf(list){
  const units = p => (p.sales && p.sales.units) || 0;
  const pool = list.filter(p=>p.img), best = pool.filter(p=>p.placements.some(pl=>pl.tier==="Best"));

function posCount(list){

function priceKey(cat, list){
  const srcTxt = x => x===SHOP_LIST ? "the shop.aidacare.com.au price" : x===PAULA_LIST ? "given by Paula" : x===MATRIX_LIST ? "from the GBB matrix sent on 26 Nov 2026" : x===SYS_LIST ? "the system list price on invoices" : "";
  const g = new Map(); list.filter(p=>num(p.price.list)!=null).forEach(p=>{ const k=srcTxt(p.listSrc); if(!g.has(k)) g.set(k,[]); g.get(k).push(p.name); });
  const gs = [...g.entries()].sort((a,b)=>b[1].length-a[1].length), nm = a => a.length>1 ? a.slice(0,-1).join(", ")+" and "+a[a.length-1] : a[0];
  const lead = gs.length ? gs[0][0] || "the system LIST" : "";
  const shopTxt = !gs.length || (gs.length===1 && !gs[0][0]) ? "" : gs.length===1 ? ` LIST is ${lead}.` : ` LIST is ${lead}, except ${gs.slice(1).map(([k,a])=>`${nm(a)} (${k||"system LIST"})`).join("; ")}.`;
  const rows = [["LIST", `Our price${gstF()>1 ? ", with 10% GST added to compare" : ", GST-free"}.${shopTxt}`]];
  if(cat.type!=="list") rows.push(["Online avg", "Average price retailers sell our product for on their websites."]);
  rows.push(["Market avg", "Average online price of the QBR competitors. Each competitor counts once: its website prices are averaged first, then the competitors."]);
  return `<dl class="pkey">${rows.map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>`;
}

const PRV_T = {}, PRV_BUSY = {};

  if(body.sales==null) delete body.sales;

function rows(){
  return [...S.prods.values()].map(p=>{

      status: isLeave(p) ? (p.status||"") : (p.flag||""),
      our:i.listC, ourEx:i.list, prop:i.propC, propEx:prop, low:i.m.low, avg:i.m.avg, high:i.m.high, n:i.m.n||null, nc:i.m.c||null, gap:i.gap, gapProp:gapOf(i.propC,i.m.avg), gm:gmOf(i.list,cost),
      onl:i.o.avg, onN:i.o.n||null, onLow:i.o.low, onHigh:i.o.high, gapO:i.gapO, gapL:i.gapL, oVsL:i.oVsL, basis:i.basis,
      units:s.units??null, uchg:unitChg(p), net:s.net??null, gma:s.gm??null };
  });
}
function tableCols(){
  const anyProp = [...S.prods.values()].some(p=>num(p.price.proposed)!=null);
  const c = [["name","Product"],["action","Flag or decision"],["our",LL("LIST")]];
  if(anyProp) c.push(["prop",LL("Proposed LIST")]);
  c.push(["onl","Online average"],["avg","Market average"],["gapL","LIST vs market"]);
  if(anyProp) c.push(["gapProp","Proposed vs market"]);
  c.push(["gma","Actual GM%"]);
  return c;
}
function tableRows(){
  let r = rows();
  if(S.tcat!=="all") r = r.filter(x=>x.catId===S.tcat);
  if(S.tf!=="all") r = r.filter(x=>matchFilter(x.p,S.tf));
  if(S.tact) r = r.filter(x=>x.action===S.tact);
  const q=S.tq.trim().toLowerCase(); if(q) r = r.filter(x=>hay(x.p).includes(q));
  const k=S.sortKey, d=S.sortDir;
  r.sort((a,b)=>{ if(k==="cat") return (a.catOrder-b.catOrder)||(a.order-b.order);
    if(k==="action") return (ACTS.findIndex(x=>x[0]===a.action)-ACTS.findIndex(x=>x[0]===b.action))*d;
    const A=a[k], B=b[k]; if(A==null&&B==null) return 0; if(A==null) return 1; if(B==null) return -1;
    return (typeof A==="string" ? A.localeCompare(B) : A-B)*d; });
  return r;
}
function cell(k,v,p){
  if(k==="our") return v==null?`<span class="add">No LIST</span>`:money0(v);
  if(k==="prop") return v==null?"":money0(v);
  if(k==="low") return v==null?"":money(v);
  if(k==="avg"||k==="onl") return v==null?"":money0(v);
  if(k==="units") return v==null?"":int(v);
  if(k==="gap"||k==="gapProp"||k==="gapO"||k==="gapL") return gapTxt(v);
  if(k==="oVsL") return v==null?"":pct(v);
  if(k==="action") return v==="none" ? "" : actPill(v,p);
  if(k==="uchg") return v==null?"":pct(v);
  if(k==="gma") return v==null?"":v.toFixed(1)+"%";

}

document.addEventListener("keydown", e=>{
  const t = e.target;
  if(t.id==="gq"){
    if(e.key==="Enter"){ const a=$("#gres .gr"); if(a){ e.preventDefault(); hideGres(true); location.hash=a.getAttribute("href").slice(1); t.blur(); } return; }
    if(e.key==="ArrowDown"){ const a=$("#gres a"); if(a){ e.preventDefault(); a.focus(); } return; }
  }
  if(t.closest && t.closest("#gres") && (e.key==="ArrowDown"||e.key==="ArrowUp")){
    e.preventDefault(); const list=[...document.querySelectorAll("#gres a")], i=list.indexOf(t);
    if(e.key==="ArrowDown" && list[i+1]) list[i+1].focus();
    else if(e.key==="ArrowUp") (list[i-1]||$("#gq")).focus();
    return;
  }
  if(e.key==="Escape"){
    if($("#ov").classList.contains("open")){ closeEditor(); return; }
    if($("#ovSites").classList.contains("open")){ $("#ovSites").classList.remove("open"); return; }
    if(!$("#gres").hidden){ hideGres(false); $("#gq").focus(); return; }
    if(document.body.classList.contains("open-d")){ closeDrawer(); return; }
    if($("#bar").classList.contains("menu-open")){ closeMenu(); $("#menuBtn").focus(); return; }
  }
  if(e.key==="Tab"){
    let box = null;
    if($("#ov").classList.contains("open")) box=$("#ov");
    else if($("#ovSites").classList.contains("open")) box=$("#ovSites");
    else if(document.body.classList.contains("open-d")) box=$("#drawer");
    if(!box) return;
    const f=[...box.querySelectorAll('a[href],button:not([disabled]),input,textarea,select,summary')].filter(x=>x.offsetParent!==null);
    if(!f.length) return;
    if(e.shiftKey && document.activeElement===f[0]){ e.preventDefault(); f[f.length-1].focus(); }
    else if(!e.shiftKey && document.activeElement===f[f.length-1]){ e.preventDefault(); f[0].focus(); }
    else if(!box.contains(document.activeElement)){ e.preventDefault(); f[0].focus(); }
  }
});

  prvFlush();

  closeMenu(); hideGres(false);
  render();

});

  svEnsure(); SV.host.hidden=false;
  const [d0,d1] = svDates();
  svQ("#svSub").textContent = "Our LIST next to competitor prices on Australian websites"+(d0?", checked "+svDate(d0)+(d1&&d1!==d0?" to "+svDate(d1):""):"")+". Open the link before quoting a competitor price.";
  const cats = svCats(), cs = svQ("#svCat");
  const ch = `<option value="">All categories</option>`+cats.map(c=>`<option value="${esc(c.id)}">${esc(c.n)}</option>`).join("");
  if(cs.dataset.h!==ch){ cs.innerHTML=ch; cs.dataset.h=ch; } cs.value = cats.some(c=>c.id===SV.cat) ? SV.cat : (SV.cat="");
  const ss = svQ("#svSt"); if(!ss.options.length) ss.innerHTML = `<option value="">All Australia</option>`+STATES.map(s=>`<option>${s}</option>`).join(""); ss.value = S.state||"";
  const who = svQ("#svWho");
  who.innerHTML = window.CPB && CPB.signedIn() ? `<span>${esc(CPB.email())}</span><button type="button" class="tb" id="svOut">Sign out</button>` : `<button type="button" class="tb" id="svIn">Team sign in</button>`;
  const notes = [];
  if(window.CPB && CPB.signedIn() && CPB.note()) notes.push(`<span>${esc(CPB.note())}</span>`);
  if(S.state) notes.push(`<span>Showing what a customer in ${S.state} can buy: retailers with a store in ${S.state} or that deliver Australia-wide. Other prices are greyed out and not in the average.</span><button type="button" id="svClear">Show all Australia</button>`);
  svQ("#svNote").innerHTML = notes.length ? `<div class="note"><div class="in">${notes.join("")}</div></div>` : "";
  svRenderList();
  if(SV.open){ const p=S.prods.get(SV.open); if(p) svQ("#svDr").innerHTML = svDetail(p); }
}
function svRenderList(){
  const list = [...S.prods.values()].filter(p=>(!SV.cat || svCatId(p)===SV.cat) && svMatch(p));
  const cats = svCats().filter(c=>!SV.cat || c.id===SV.cat);
  const out = cats.map(c=>{
    const ps = list.filter(p=>svCatId(p)===c.id).sort((a,b)=>(prodRank(a)-prodRank(b))||a.name.localeCompare(b.name));
    return ps.length ? `<section class="sec"><h2>${esc(c.n)} <span>${ps.length} product${ps.length>1?"s":""}</span></h2><div class="grid">${ps.map(svCard).join("")}</div></section>` : "";
  }).join("");
  const band = num(S.settings.band) ?? 5;
  svQ("#svApp").innerHTML = (out || `<p class="empty">No products match. Try another word or clear the search.</p>`) +
    `<p class="foot">Prices come from public Australian retail websites. eBay, marketplaces and second-hand sites are not counted. "Market avg" averages each competitor product's prices, then averages the competitors. Within ${band}% of the market counts as in line. Prices change often, so check the retailer's page before you quote it.</p>`;
}
function svStTag(x){
  const e = exclOf(x.site); if(e) return `<span class="st no">${esc(e)}, not counted</span>`;
  if(!S.state) return "";
  const a = availIn(x.site, S.state);
  return a==="store" ? `<span class="st yes">Store in ${S.state}</span>` : a==="online" ? `<span class="st yes">Delivers Australia-wide</span>` : `<span class="st no">Not confirmed for ${S.state}</span>`;
}
function svLane(p, m, sk, used){
  const rows = compsOf(p).map((c,ci)=>({c, ci, pts:c.sites.filter(svCounts)})).filter(r=>r.pts.length);
  if(!rows.length) return "";
  const our = m.list;
  const vals = rows.flatMap(r=>r.pts.map(x=>num(x.p))).concat(our!=null?[our]:[], m.avg!=null?[m.avg]:[]);
  let lo=Math.min(...vals), hi=Math.max(...vals); const pad=(hi-lo||hi*0.2||1)*0.08; lo-=pad; hi+=pad;
  const nar = window.innerWidth < 600, W = nar?360:640, L = nar?104:150, R = nar?30:20, top=30, rh=30, H=top+rows.length*rh+26, cut = nar?14:22;
  const X = v => L + (v-lo)/(hi-lo)*(W-L-R);
  let s = `<svg class="lane" viewBox="0 0 ${W} ${H}" role="img" aria-label="Competitor prices compared with our LIST">`;
  rows.forEach((r,i)=>{ const y=top+i*rh+rh/2;
    s += `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#E3E6EA"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="12" fill="#1B2430">${esc(r.c.name.length>cut?r.c.name.slice(0,cut-1)+"…":r.c.name)}</text>`;
    r.pts.forEach(x=>{ const u = used(x, r.c.name), col = SV_COL[r.ci%3]; s += `<circle cx="${X(num(x.p)).toFixed(1)}" cy="${y}" r="6" fill="${u?col:"#fff"}" stroke="${col}" stroke-width="2"><title>${esc(x.site)} ${svMoney(num(x.p))}${u?"":" (different size or type, not in the average)"}</title></circle>`; });
  });
  const yb = top+rows.length*rh;
  if(m.avg!=null){ const x=X(m.avg); s += `<line x1="${x}" x2="${x}" y1="${top-6}" y2="${yb}" stroke="#5B6573" stroke-dasharray="4 3"/><text x="${x}" y="${yb+16}" text-anchor="middle" font-size="11" fill="#5B6573">Market avg ${svMoney0(m.avg)}</text>`; }
  if(our!=null){ const x=X(our); s += `<line x1="${x}" x2="${x}" y1="${top-10}" y2="${yb}" stroke="#1B2430" stroke-width="2.5"/><text x="${x}" y="${top-14}" text-anchor="middle" font-size="12" font-weight="700" fill="#1B2430">Our LIST ${svMoney0(our)}</text>`; }
  return s + `</svg>`;
}
function svDetail(p){
  const m = svInfo(p), sk = skuOf(p), leave = isLeave(p);
  const tagsOf = (x, name) => sk ? tagOf(sk.cfg, x, name) : [];
  const used = (x, name) => svCounts(x) && (!sk || !m.sz || tagsOf(x, name).includes(m.sz));
  const fl = flyLinks(p), spec = (p.spec||[]).length ? `<ul class="spec">${p.spec.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>` : "";
  const tags = [isAspire(p)?`<span class="tag asp">Aspire</span>`:"", svTiers(p), p.flag?`<span class="tag warn">${esc(p.flag)}</span>`:""].join("");
  let h = `<div class="dh">${svThumb(p)}<div><h2 id="svTitle">${esc(p.name)}</h2>${tags?`<div class="tags">${tags}</div>`:""}${spec}${fl?`<div class="fly">${fl}</div>`:""}</div><button class="x" id="svX" aria-label="Close">×</button></div>`;
  if(leave) h += `<div class="ds"><div class="leave"><b>${esc(p.status||"Leaving the range")}</b>${esc(p.instead||"")}</div></div>`;
  if(sk && sk.rows.length){
    const hasCode = sk.rows.some(r=>r.code);
    h += `<div class="ds"><h3>Our LIST</h3><table><thead><tr><th>${sk.cfg.kind==="type"?"Type":"Size"}</th>${hasCode?"<th>Code</th>":""}<th class="r">LIST</th></tr></thead><tbody>${sk.rows.map(r=>`<tr class="${m.sz===r.k?"ref":""}"><td>${esc(SZ[r.k]||r.k)}</td>${hasCode?`<td>${esc(r.code)}</td>`:""}<td class="r">${r.list!=null?svMoney(r.list):"Not set"}</td></tr>`).join("")}</tbody></table>${m.sz?`<p class="small">The comparison below uses ${m.sz==="from"?"competitors' cheapest size against our cheapest LIST":"the "+esc(svSzName(m.sz))+" row"}.</p>`:""}</div>`;
  } else {
    const l = num(p.price.list);
    h += `<div class="ds"><h3>Our LIST</h3><p class="sum" style="margin:0">${l!=null?`<b>${svMoney(l)}</b>`:"Not set yet"}</p></div>`;
  }
  const why = REASONS[p.id];
  if(why && why.length) h += `<div class="ds"><h3>Why sell it</h3><ul class="why">${why.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
  h += `<div class="ds"><h3>How we compare${S.state?" in "+S.state:""}</h3>`;
  if(m.gap!=null){
    const c = m.st||"inline", word = c==="inline" ? "in line with" : Math.abs(m.gap).toFixed(0)+"% "+(c==="above"?"above":"below");
    h += `<p class="sum">${svPill(m)} Our LIST ${svMoney(m.list)} is ${word} the market average of ${svMoney0(m.avg)} (${m.n} price${m.n>1?"s":""} from ${m.c} competitor product${m.c>1?"s":""}${m.n>1?", "+svMoney0(m.low)+" to "+svMoney0(m.high):""}).</p>`;
    h += svLane(p, m, sk, used);
    if(sk && compsOf(p).some(c=>c.sites.some(x=>svCounts(x) && !used(x, c.name)))) h += `<p class="small">Hollow dots are a different size or type, so they are not in the average.</p>`;
  } else h += `<p class="small" style="margin:0">No competitor price ${S.state?"a customer in "+S.state+" can buy ":""}to compare with.</p>`;
  h += `</div>`;
  const comps = compsOf(p);
  if(comps.length){
    h += `<div class="ds"><h3>Competitor prices</h3>`;
    comps.forEach((c,ci)=>{
      const sites = c.sites.filter(x=>num(x.p)!=null).sort((a,b)=>(svCounts(b)-svCounts(a))||(num(a.p)-num(b.p)));
      h += `<div class="comp"><h4><span class="dot" style="background:${SV_COL[ci%3]}"></span>${esc(c.name)}</h4>`;
      if(!sites.length) h += `<p class="small" style="margin:4px 0 0">No Australian online price found.</p>`;
      sites.forEach(x=>{
        const u = svSafe(x.url), ok = svCounts(x), tg = tagsOf(x, c.name).filter(k=>SZ[k]);
        const szc = tg.map(k=>`<span class="sz${m.sz&&k===m.sz?" use":""}">${esc(SZ[k])}</span>`).join("");
        const note = String(x.note||"").replace(/;?\s*QBR says '[^']*',?\s*/g, "; ").replace(/^[;\s]+|[;\s]+$/g, "");
        h += `<div class="site${ok?"":" na"}"><span>${u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(x.site||"Website")}</a>`:esc(x.site||"Website")}</span><span class="pr">${svMoney(num(x.p))}</span><span class="nt">${szc}${svStTag(x)}${note?`<span>${esc(note)}</span>`:""}${x.date?`<span>Checked ${svDate(x.date)}</span>`:""}</span></div>`;
      });
      h += `</div>`;
    });
    h += `</div>`;
  }
  return h;
}
function svOpen(id){
  const p = S.prods.get(id); if(!p) return;
  SV.open = id; SV.lastFocus = SV.R.activeElement;
  const dr = svQ("#svDr"); dr.innerHTML = svDetail(p); dr.classList.add("on"); dr.setAttribute("aria-hidden","false"); svQ("#svOv").classList.add("on");
  document.body.style.overflow = "hidden"; dr.scrollTop = 0; svQ("#svX").focus();
}
function svClose(){
  SV.open = null; const dr = svQ("#svDr"); dr.classList.remove("on"); dr.setAttribute("aria-hidden","true"); svQ("#svOv").classList.remove("on");
  document.body.style.overflow = "";
  if(SV.lastFocus && SV.lastFocus.focus) SV.lastFocus.focus();
}

/* ---------- data ---------- */
(async function start(){
  for(let i=0;i<30 && !(window.claude && window.claude.use);i++) await new Promise(r=>setTimeout(r,100));
  const claude = window.claude;
  if(!claude || !claude.use){ $("#status").textContent="The page could not start. Reload it, and check your connection."; return; }
  const db = await claude.use("db");
  if(!db){ $("#status").textContent="Can't reach the price database. Check your connection and reload."; return; }
  S.db = db;
  S.team = !!(window.CPB && CPB.isTeam());
  S.canWrite = S.team;
  if(S.team){ const so=$("#signOut"); if(so){ so.hidden=false; so.title="Signed in as "+CPB.email(); } }
  claude.use("downloads").then(d=>{ S.dl = d || null; render(); }).catch(()=>{});
  const timer = setTimeout(()=>{ if(!(S.got.c&&S.got.p)){ const st=$("#status"); if(st){ st.className="msg warn"; st.textContent="Saved products can't be reached yet. Check your connection; the page will fill in when they arrive."; } } }, 10000);
  const fail = e => { clearTimeout(timer); const st=$("#status"); if(st){ st.className="msg warn"; st.textContent="Saved products could not be loaded ("+((e&&e.code)||"error")+")."; } };
  db.collection("categories").onSnapshot(snap=>{ S.cats = withSeed("categories", snap.docs).map(d=>Object.assign({id:d.id}, d.data(), noteFor("categories", d.id))).map(c=>c.type==="list" && c.name==="Leaving the range" ? Object.assign(c,{name:"Discontinuation Plan"}) : c).sort((a,b)=>(a.order||0)-(b.order||0)); S.got.c=true; if(!snap.metadata.fromCache && S.got.p) clearTimeout(timer); render(); }, fail);
  db.collection("products").onSnapshot(snap=>{ S.prods = new Map(withSeed("products", snap.docs).map(d=>[d.id, norm(Object.assign({id:d.id}, d.data(), noteFor("products", d.id)))])); S.got.p=true; if(!snap.metadata.fromCache && S.got.c) clearTimeout(timer); render(); }, fail);
  db.doc("retail/main").onSnapshot(snap=>{ S.retail = snap.exists ? snap.data() : null; render(); }, ()=>{});
  db.collection("changes").onSnapshot(snap=>{ S.changes = snap.docs.flatMap(d=>{ const x=d.data()||{}; const date=x.date||d.id; return (Array.isArray(x.items)?x.items:[]).map(it=>Object.assign({date}, it)); }).sort((a,b)=>String(b.date).localeCompare(String(a.date))); render(); }, ()=>{});
  db.doc("settings/main").onSnapshot(snap=>{ if(snap.exists){ const d=snap.data(); S.settings = { band: d.band ?? 5, investUnits: d.investUnits ?? 10, investGap: d.investGap ?? 30, listGst: gstSetting(d) }; } render(); }, ()=>{});
})();
})();
</script>
